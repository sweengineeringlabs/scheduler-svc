[package]
name         = "scheduler-svc-core"
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/scheduler-svc"
rust-version = "1.98"
description  = "scheduler-svc core: the technology-free reference implementation of scheduler-pattern's Scheduler trait (InMemoryScheduler), backed only by std::thread + futures::executor::block_on. No external dependency -- no spi backend exists yet, see docs/3-design/architecture.md."
keywords     = ["scheduler", "core", "async", "swe"]
categories   = ["asynchronous"]

[package.metadata.arch]
application_type = "lib"
service_type     = "scheduler"

[lib]
name = "scheduler_svc_core"
path = "src/lib.rs"

[dependencies]
scheduler-pattern = { git = "https://github.com/sweengineeringlabs/scheduler-pattern.git", tag = "v0.1.0" }
futures            = "0.3"

[dev-dependencies]

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
